<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 960" role="img" aria-labelledby="title desc">
  <title id="title">AI as a leverage machine</title>
  <desc id="desc">An editorial systems diagram where human taste and agency flow through an AI engine, tools and verification into shipped work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b0a"/>
      <stop offset="1" stop-color="#151a16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#87c7a6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#87c7a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dbe4dc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1536" height="960" rx="34" fill="url(#bg)"/>
  <rect width="1536" height="960" rx="34" fill="url(#grid)"/>
  <circle cx="768" cy="464" r="310" fill="url(#glow)" filter="url(#soft)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#dce4dd">
    <text x="90" y="88" font-size="22" letter-spacing="3" fill="#91a096">NAMAN / FIELD NOTE 09</text>
    <text x="90" y="133" font-size="34" font-weight="700">OUTPUT ≈ TASTE × AGENCY × LEVERAGE</text>
    <text x="90" y="166" font-size="17" fill="#819087">mental model, not physics</text>
  </g>

  <g fill="none" stroke="#91a096" stroke-opacity=".32" stroke-width="2">
    <path d="M350 462H560"/>
    <path d="M976 462h210"/>
    <path d="M768 278v-92"/>
    <path d="M768 646v108"/>
  </g>

  <g transform="translate(150 336)">
    <rect width="250" height="250" rx="28" fill="#111512" stroke="#323b34"/>
    <text x="28" y="40" font-family="ui-monospace, monospace" font-size="16" fill="#87948b" letter-spacing="2">HUMAN INPUT</text>
    <circle cx="125" cy="116" r="54" fill="#edf1eb"/>
    <ellipse cx="108" cy="111" rx="7" ry="11" fill="#151816"/>
    <ellipse cx="142" cy="111" rx="7" ry="11" fill="#151816"/>
    <path d="M93 167c18 13 46 13 64 0" fill="none" stroke="#edf1eb" stroke-width="10" stroke-linecap="round"/>
    <text x="28" y="205" font-family="ui-monospace, monospace" font-size="20" fill="#edf1eb">taste</text>
    <text x="28" y="231" font-family="ui-monospace, monospace" font-size="20" fill="#edf1eb">intent + agency</text>
  </g>

  <g transform="translate(558 254)">
    <circle cx="210" cy="210" r="184" fill="#111612" stroke="#5b7464" stroke-width="2"/>
    <circle cx="210" cy="210" r="146" fill="none" stroke="#86b99b" stroke-opacity=".24" stroke-width="2" stroke-dasharray="8 10"/>
    <circle cx="210" cy="210" r="103" fill="#86b99b" fill-opacity=".09" stroke="#8ac3a1" stroke-width="2"/>
    <circle cx="210" cy="210" r="16" fill="#a9dbbc"/>
    <circle cx="210" cy="210" r="7" fill="#0d100e"/>

    <g font-family="ui-monospace, monospace" text-anchor="middle">
      <text x="210" y="196" font-size="16" fill="#91a096" letter-spacing="3">AI</text>
      <text x="210" y="245" font-size="28" font-weight="700" fill="#edf1eb">LEVERAGE</text>
    </g>

    <g font-family="ui-monospace, monospace" font-size="15">
      <g transform="translate(75 68)"><rect width="110" height="38" rx="19" fill="#1e2721" stroke="#4f6657"/><text x="55" y="24" text-anchor="middle" fill="#b8c6bc">context</text></g>
      <g transform="translate(235 68)"><rect width="110" height="38" rx="19" fill="#1e2721" stroke="#4f6657"/><text x="55" y="24" text-anchor="middle" fill="#b8c6bc">search</text></g>
      <g transform="translate(57 296)"><rect width="110" height="38" rx="19" fill="#1e2721" stroke="#4f6657"/><text x="55" y="24" text-anchor="middle" fill="#b8c6bc">code</text></g>
      <g transform="translate(253 296)"><rect width="110" height="38" rx="19" fill="#1e2721" stroke="#4f6657"/><text x="55" y="24" text-anchor="middle" fill="#b8c6bc">tools</text></g>
    </g>
  </g>

  <g transform="translate(1136 336)">
    <rect width="250" height="250" rx="28" fill="#f1eee6"/>
    <text x="28" y="40" font-family="ui-monospace, monospace" font-size="16" fill="#6e766f" letter-spacing="2">OUTPUT</text>
    <rect x="28" y="74" width="194" height="112" rx="14" fill="#171a18"/>
    <circle cx="50" cy="98" r="5" fill="#b64f55"/>
    <circle cx="69" cy="98" r="5" fill="#c3a343"/>
    <circle cx="88" cy="98" r="5" fill="#74aa8b"/>
    <path d="M50 127h118M50 149h91M50 171h137" stroke="#dce4dd" stroke-opacity=".62" stroke-width="7" stroke-linecap="round"/>
    <text x="28" y="222" font-family="ui-monospace, monospace" font-size="21" font-weight="700" fill="#171a18">SHIPPED THING</text>
  </g>

  <g transform="translate(615 92)" font-family="ui-monospace, monospace">
    <rect width="306" height="86" rx="18" fill="#101411" stroke="#333d35"/>
    <text x="24" y="34" font-size="14" fill="#7f8e84" letter-spacing="2">BOUNDARY CONDITION</text>
    <text x="24" y="62" font-size="19" fill="#e4eae4">judgment → 0 ⇒ value → 0</text>
  </g>

  <g transform="translate(574 760)" font-family="ui-monospace, monospace">
    <rect width="388" height="108" rx="20" fill="#101411" stroke="#333d35"/>
    <text x="24" y="31" font-size="14" fill="#7f8e84" letter-spacing="2">VERIFY BEFORE "DONE"</text>
    <g transform="translate(24 50)" font-size="16">
      <text x="0" y="18" fill="#a8d7b9">01 inspect</text>
      <text x="112" y="18" fill="#d9bc68">02 test</text>
      <text x="210" y="18" fill="#d98287">03 challenge</text>
      <text x="0" y="47" fill="#dce4dd">04 own the result</text>
    </g>
  </g>

  <g transform="translate(98 706)" font-family="ui-monospace, monospace">
    <text x="0" y="0" font-size="14" fill="#7f8e84" letter-spacing="2">SKILL FLOOR ↓</text>
    <path d="M0 92 C75 75 116 53 169 60 S281 32 349 20" fill="none" stroke="#8ac3a1" stroke-width="4"/>
    <path d="M0 92H360" stroke="#6b766e" stroke-opacity=".35"/>
    <circle cx="349" cy="20" r="7" fill="#a9dbbc"/>
    <text x="193" y="112" font-size="14" fill="#7f8e84">ambition ceiling ↑</text>
  </g>

  <g transform="translate(1110 718)" font-family="ui-monospace, monospace">
    <rect width="326" height="150" rx="20" fill="#17120f" stroke="#5e4a36"/>
    <text x="24" y="34" font-size="14" fill="#aa8d70" letter-spacing="2">FAILURE MODE</text>
    <text x="24" y="72" font-size="20" fill="#f0e5d8">speed × no taste</text>
    <text x="24" y="101" font-size="20" fill="#f0e5d8">= faster slop</text>
    <text x="24" y="130" font-size="14" fill="#aa8d70">the multiplier is neutral</text>
  </g>

  <g fill="#8ac3a1">
    <path d="M538 454l18 8-18 8z"/>
    <path d="M1164 454l18 8-18 8z"/>
  </g>
</svg>
